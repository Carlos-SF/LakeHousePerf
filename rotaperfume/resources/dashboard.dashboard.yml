# O dashboard comercial AI/BI como CÓDIGO: o .lvdash.json versionado no repo, declarado
# como recurso do bundle. Sobe (e volta) idêntico com `databricks bundle deploy` —
# dashboard clicado não tem diff, revisão nem rollback; este tem (`git revert`).
#
# As queries do JSON usam nome de tabela PURO (FROM fato_vendas). O catálogo e o schema
# vêm de dataset_catalog/dataset_schema abaixo — prefixar o SQL faz o bundle ignorá-los.
# O warehouse é o "Serverless Starter Warehouse" (var.warehouse_id): dashboard Lakeview
# precisa de SQL warehouse, não roda no serverless de notebook como as camadas.
resources:
  dashboards:
    dashboard_comercial:
      display_name: "[${bundle.target}] rotaperfume — Comercial"
      file_path: dashboard-comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
