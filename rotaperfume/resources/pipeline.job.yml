# rotaperfume_pipeline — o job da noite, que cresce a cada prompt.
#
# Hoje ele tem UMA tarefa: raw_conferencia (confere a chegada dos CSVs no Volume).
# Nos próximos cinco prompts ele ganha as camadas do medalhão:
#
#   raw_conferencia ─▶ bronze ─▶ silver ─▶ gold ─▶ qualidade ─▶ publicação
#        (hoje)         (p2)      (p3)      (p4)       (p5)         (p6)
#
# Serverless em tudo (nenhum cluster é declarado). No target dev, o `mode:
# development` prefixa o nome para "[dev carlos] rotaperfume_pipeline" e pausa o
# agendamento — comportamento esperado e desejado em desenvolvimento.

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline

      schedule:
        # Diariamente às 06:00, horário de São Paulo.
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
