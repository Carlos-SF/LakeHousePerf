# O pipeline medalhão da rotaperfume, orquestrado como um job Lakeflow.
# A ordem é o conteúdo: cada camada só roda se a anterior passar.
#
# A silver são quatro tarefas em PARALELO (uma por assunto); a gold é uma CADEIA
# (dimensões → fato → marts → testes), e a última tarefa, `testes`, PARA o job se
# algum dos 9 testes de qualidade falhar:
#
#                                         ┌─▶ silver_clientes ────────┐
#                                         ├─▶ silver_pedidos ─────────┤
#   raw_conferencia ──▶ bronze_ingestao ──┼─▶ silver_itens_produtos ──┤
#      confere o          10 tabelas       └─▶ silver_crm_financeiro ──┤
#      que chegou         Delta, tudo texto                            │
#                                                                      ▼
#              gold_dimensoes ──▶ gold_fato_vendas ──▶ gold_marts ──▶ testes ──▶ ml_features
#              4 dimensões        grão item, 191.080   3 marts        9 testes    features de
#              conformadas        conformado           por diretoria  quebram o   cliente (ML)
#                                                                      job
#
# A camada de ML começa em `ml_features`: roda DEPOIS de `testes` (modelo não se treina com
# dado que ainda não passou nos testes) e grava gold.features_treino e gold.features_cliente.
#
# Agendado para 06:00 America/Sao_Paulo. No dev o agendamento fica PAUSED (preset do
# target dev em databricks.yml); em prod, roda.
resources:
  jobs:
    rotaperfume_pipeline:
      name: "[${bundle.target}] rotaperfume — pipeline medalhão"

      # O catálogo vem do bundle (var.catalog) e chega às notebooks como widget `catalog`.
      parameters:
        - name: catalog
          default: ${var.catalog}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        # pause_status não é fixado aqui: quem decide é o target — PAUSED no dev
        # (presets.trigger_pause_status), ativo no prod.

      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
          # Sem cluster = compute serverless.

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py

        # A silver: quatro tarefas SQL, uma por assunto. Todas dependem só de
        # bronze_ingestao — nenhuma depende da outra, então rodam EM PARALELO.
        # São SQL-notebooks (.sql com cabeçalho `-- Databricks notebook source`)
        # rodando via notebook_task no serverless: este workspace não tem SQL
        # warehouse, então não há `sql_task`. O caminho da tabela é hardcoded no
        # SQL (lakehouse_rotaperfume.silver.x), de propósito — SQL legível.
        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/01-clientes.sql

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/02-pedidos.sql

        - task_key: silver_itens_produtos
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/03-itens-e-produtos.sql

        - task_key: silver_crm_financeiro
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/04-crm-e-financeiro.sql

        # A gold: uma CADEIA sequencial (o oposto do paralelo da silver), porque cada
        # etapa consome a anterior. dimensões → fato → marts → testes. Também são
        # SQL-notebooks serverless. `testes` fica por último e é obrigatório: se algum
        # dos 9 testes levantar raise_error, a tarefa falha e nada depois dela roda.
        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_produtos
            - task_key: silver_crm_financeiro
          notebook_task:
            notebook_path: ../src/gold/05-dimensoes.sql

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          notebook_task:
            notebook_path: ../src/gold/06-fato-vendas.sql

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          notebook_task:
            notebook_path: ../src/gold/07-marts.sql

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          notebook_task:
            notebook_path: ../src/gold/08-testes.sql

        # A camada de ML. `ml_features` só roda se `testes` passar: modelo não se treina com
        # dado que ainda não passou nos testes de qualidade. Notebook Python serverless que
        # grava gold.features_treino (com alvo) e gold.features_cliente (sem alvo).
        - task_key: ml_features
          depends_on:
            - task_key: testes
          notebook_task:
            notebook_path: ../src/ml/11-features.py
